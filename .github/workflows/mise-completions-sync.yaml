---
# yamllint disable rule:line-length
name: mise-completions-sync copr rebuild
on:
  push:
    branches:
      - main
    paths:
      - tools-rust/mise-completions-sync/mise-completions-sync.spec
  workflow_dispatch:

jobs:
  curl:
    runs-on: ubuntu-slim
    steps:
      - name: Run webhook for copr
        run: |
          curl -X POST https://copr.fedorainfracloud.org/webhooks/custom/${{ secrets.COPR_TOOLS_RUST }}/mise-completions-sync
